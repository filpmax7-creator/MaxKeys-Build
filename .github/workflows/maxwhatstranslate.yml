name: Build MaxWhatsTranslate
on:
  workflow_dispatch:
  push:
    paths:
      - 'MaxWhatsTranslate/**'
      - '.github/workflows/maxwhatstranslate.yml'
permissions:
  contents: read
jobs:
  package:
    runs-on: macos-26
    defaults:
      run:
        working-directory: MaxWhatsTranslate
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: beerpiss/theos-action@v1.7.0
      - name: Build and verify deb
        shell: bash
        run: |
          if ! make package FINALPACKAGE=1 > build.log 2>&1; then
            cat build.log
            grep -Ei 'error:|fatal|warning:|error [0-9]|not found' build.log | head -25 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
          command -v dpkg-deb >/dev/null || brew install dpkg
          packages=(packages/*.deb)
          test "${#packages[@]}" -eq 1
          test "$(dpkg-deb -f "${packages[0]}" Package)" = com.maxfilp.maxwhatstranslate
          test "$(dpkg-deb -f "${packages[0]}" Architecture)" = iphoneos-arm64
          dpkg-deb -c "${packages[0]}" | grep 'MaxWhatsTranslate.dylib'
      - uses: actions/upload-artifact@v4
        with:
          name: MaxWhatsTranslate-rootless
          path: MaxWhatsTranslate/packages/*.deb
          if-no-files-found: error
