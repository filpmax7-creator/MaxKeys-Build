name: Build MaxKeys
on:
  workflow_dispatch:
  push:
    paths:
      - 'MaxKeys/**'
      - '.github/workflows/maxkeys.yml'
permissions:
  contents: read
jobs:
  package:
    runs-on: macos-26
    defaults:
      run:
        working-directory: MaxKeys
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: beerpiss/theos-action@v1.7.0
      - name: Build rootless package
        run: |
          bash prepare-kayoko.sh
          if ! make package FINALPACKAGE=1 TARGET=iphone:clang:latest:16.0 ARCHS="arm64 arm64e" THEOS_PACKAGE_SCHEME=rootless > build.log 2>&1; then
            cat build.log
            grep -E 'error:|fatal:|No rule|not found|Error [0-9]' build.log | head -20 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
      - name: Verify package
        shell: bash
        run: |
          command -v dpkg-deb >/dev/null || brew install dpkg
          shopt -s nullglob
          packages=(packages/*.deb)
          test "${#packages[@]}" -eq 1
          test "$(dpkg-deb -f "${packages[0]}" Architecture)" = iphoneos-arm64
          test "$(dpkg-deb -f "${packages[0]}" Package)" = com.maxfilp.maxkeys
          test "$(dpkg-deb -f "${packages[0]}" Version)" = "$(sed -n 's/^Version: //p' control)"
          dpkg-deb -c "${packages[0]}" > package-files.txt
          for module in MaxKeys KayokoCore KayokoHelper; do
            grep -F "/$module.dylib" package-files.txt
          done
      - uses: actions/upload-artifact@v4
        with:
          name: MaxKeys-rootless
          path: MaxKeys/packages/*.deb
          if-no-files-found: error
